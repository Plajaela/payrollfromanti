<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Sharp vibrant gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Top inner highlight for 3D feel -->
    <linearGradient id="topGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="black" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <!-- Using a super-ellipse path for a more premium "Apple-like" squircle -->
  <path d="M512 170.67C512 25.13 486.87 0 341.33 0H170.67C25.13 0 0 25.13 0 170.67V341.33C0 486.87 25.13 512 170.67 512H341.33C486.87 512 512 486.87 512 341.33V170.67Z" fill="url(#mainGrad)"/>
  
  <!-- Subtle top bezel -->
  <path d="M512 170.67C512 25.13 486.87 0 341.33 0H170.67C25.13 0 0 25.13 0 170.67V220 Q256 180 512 220 V170.67Z" fill="url(#topGlow)" />

  <!-- Main "P" -->
  <text x="50%" y="53%" 
    fill="white" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="320" 
    text-anchor="middle" 
    dominant-baseline="central"
    filter="url(#pShadow)"
    style="letter-spacing: -10px;"
  >P</text>
  
  <!-- "Fan/Wind" Flair to represent "Padlomdee" -->
  <g stroke="white" stroke-width="12" stroke-linecap="round" stroke-opacity="0.3" fill="none">
    <path d="M380 120 Q440 160 380 200" />
    <path d="M410 160 Q470 200 410 240" stroke-opacity="0.15" />
  </g>
</svg>
